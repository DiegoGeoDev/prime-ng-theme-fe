<p-toast />

<div class="h-full w-full grid place-items-center">
  <p-card
    header="Login to your account"
    subheader="Enter your email below to login to your account"
    class="border! border-surface!"
  >
    <form [formGroup]="form" (ngSubmit)="onLogin()" class="flex flex-col gap-4 mt-4">
      <div class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
          <label for="login-email">Email</label>
          <input
            pInputText
            id="login-email"
            type="email"
            placeholder="email@example.com"
            class="w-full"
            formControlName="email"
          />
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <p-message severity="error" size="small" variant="simple">Enter a valid email address.</p-message>
          }
        </div>

        <div class="flex flex-col gap-1">
          <label for="login-password">Password</label>
          <input
            pInputText
            id="login-password"
            placeholder="********"
            type="password"
            class="w-full"
            formControlName="password"
          />
          @if (form.controls.password.invalid && form.controls.password.touched) {
            <p-message severity="error" size="small" variant="simple">Password must be at least 6 characters.</p-message>
          }

          <div class="flex justify-center items-center">
            <p-button label="Forgot your password?" link="true" size="small" type="button" />
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <p-button label="Login" [fluid]="true" type="submit" />

        <p-button
          label="Login with Google"
          variant="outlined"
          severity="secondary"
          [fluid]="true"
          type="button"
        />

        <div class="flex justify-center items-center">
          <p class="text-sm text-center text-muted-color">Don't have an account?</p>
          <p-button label="Sign up" link="true" size="small" type="button" />
        </div>
      </div>
    </form>
  </p-card>
</div>
