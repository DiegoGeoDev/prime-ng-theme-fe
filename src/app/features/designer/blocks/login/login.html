<p-toast />

<div class="h-full w-full grid place-items-center">
  <p-card
    header="Login to your account"
    subheader="Enter your email below to login to your account"
    class="border! border-surface!"
  >
    <div class="flex flex-col gap-4 mt-4">
      <div class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
          <label for="login-email">Email</label>
          <input
            pInputText
            id="login-email"
            type="email"
            placeholder="email@example.com"
            class="w-full"
            [(ngModel)]="email"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label for="login-password"> Password </label>
          <input
            pInputText
            id="login-password"
            placeholder="********"
            type="password"
            class="w-full"
            [(ngModel)]="password"
          />

          <div class="flex justify-center items-center">
            <p-button label="Forgot your password?" link="true" size="small" />
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <p-button label="Login" [fluid]="true" (onClick)="onLogin()" />

        <p-button
          label="Login with Google"
          variant="outlined"
          severity="secondary"
          [fluid]="true"
        />

        <div class="flex justify-center items-center">
          <p class="text-sm text-center text-muted-color">Don't have an account?</p>
          <p-button label="Sign up" link="true" size="small" />
        </div>
      </div>
    </div>
  </p-card>
</div>
